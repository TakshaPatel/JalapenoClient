# Sets default memory used for gradle commands.
# NOTE: the daemon heap does NOT control the vineflower decompile subprocess.
# Run './gradlew setup' with:  _JAVA_OPTIONS="-Xmx6G"  or it will die with OutOfMemoryError.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
